publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0
  geolocator: ^13.0.0
  flutter_compass: ^0.8.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  http: ^1.2.0
  image: ^4.1.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
